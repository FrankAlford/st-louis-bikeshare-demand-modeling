[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-louis-bikeshare-demand-modeling"
version = "0.1.0"
description = "Geospatial demand modeling helpers for a St. Louis bike-share planning analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "mapclassify>=2.6",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyproj>=3.6",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
